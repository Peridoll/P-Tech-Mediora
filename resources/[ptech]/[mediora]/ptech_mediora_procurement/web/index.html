<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医療物資調達</title><link rel="stylesheet" href="style.css"></head><body>
<main id="panel" hidden aria-label="医療物資調達"><header><div><small>P-TECH / MEDIORA PROCUREMENT</small><h1>医療物資調達</h1><p>受取 → 病院へ納品 → 領収書発行</p></div><button id="close">閉じる ×</button></header>
<section class="growth"><div><small>受注状況</small><h2 id="orders">0 / 1</h2></div><div class="xp"><p id="cargo">所持物資：0個</p><p id="receipts">所持領収書：0枚</p></div></section>
<section class="mission"><div><small>次の目的</small><h2 id="stage">受注していません</h2><p id="destination"></p></div><button data-action="cancel" id="cancel" disabled>未受取の受注を中止</button></section>
<section class="mission"><div><h2>医療物資調達を受注</h2><p id="terms"></p><p>受取期限なし。再起動・ログアウトで未受取の受注は終了します。</p><p>受取後は物資が残り、後から納品できます。支払いは別の精算システムで行います。</p></div><button data-action="start" id="start" class="primary">受注する</button></section>
<footer><button data-action="stash">病院製薬素材倉庫</button><button data-action="refresh">更新</button><span>Escで閉じる · 受取・納品は現地のターゲット操作</span></footer><p id="error" role="alert"></p></main><script src="app.js"></script></body></html>
