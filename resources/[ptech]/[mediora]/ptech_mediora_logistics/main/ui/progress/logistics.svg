<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 50" aria-hidden="true"
     fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <style>
    svg { color: var(--mediora-progress-accent, #62dfff); }
    .cat { animation: peek 2.6s ease-in-out infinite; }
    .flap { animation: open 2.6s ease-in-out infinite; }
    .right .flap { animation-delay: .055s; }
    .eyes { animation: blink 2.6s linear infinite; transform-origin: 32px 21.5px; }

    @keyframes peek {
      0%, 17.3%, 74.6%, 100% { transform: translateY(25px); }
      32.3%, 60.4% { transform: translateY(0); }
    }
    @keyframes open {
      0%, 3.8%, 85.8%, 100% { transform: none; }
      8.5%, 80.6% { transform: matrix(.5, -.68, 0, 1, 0, 0); }
      12.7%, 77.5% { transform: matrix(-.35, -.74, 0, 1, 0, 0); }
      16.9%, 75.4% { transform: matrix(-.8, -.48, 0, 1, 0, 0); }
    }
    @keyframes blink {
      0%, 42%, 48.1%, 100% { transform: scaleY(1); }
      44.2%, 45.4% { transform: scaleY(.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cat, .flap, .eyes { animation: none; }
      .cat { transform: translateY(25px); }
    }
  </style>
  <defs>
    <clipPath id="above-box"><path d="M0 0h64v27H0z"/></clipPath>
  </defs>
  <rect x="13" y="24" width="38" height="10" rx="3" fill="#0b1821"/>
  <g clip-path="url(#above-box)">
    <g class="cat">
      <path d="M21 27l-1-6 1-11 6 5h10l6-5 1 11-1 6-5 4H26z" fill="#142a35"/>
      <g class="eyes" fill="currentColor" stroke="none">
        <circle cx="27" cy="21.5" r="1.25"/>
        <circle cx="37" cy="21.5" r="1.25"/>
      </g>
      <path d="M31.25 24h1.5l-.75.8z" fill="currentColor" stroke="none"/>
    </g>
  </g>
  <rect x="13" y="26" width="38" height="19" rx="3" fill="#142a35"/>
  <path d="M28 35h8"/>
  <g transform="translate(12 23.2)">
    <path class="flap" d="M0 0h20v4.8H0z" fill="#142a35"/>
  </g>
  <g class="right" transform="translate(52 23.2) scale(-1 1)">
    <path class="flap" d="M0 0h20v4.8H0z" fill="#142a35"/>
  </g>
</svg>
