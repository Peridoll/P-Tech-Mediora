<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>html,body{background:transparent!important}#app[hidden]{display:none!important}</style><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTECH 診察記録</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="app" hidden>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="patient-title">
    <header><div class="brand"><span class="cross">✚</span><div>P-TECH <span>MEDIORA</span><small>診察記録</small></div></div><div class="header-right"><span id="source" class="source"></span><button id="close" class="icon-button" aria-label="閉じる">×</button></div></header>
    <div class="content">
      <div class="patient-heading"><div><p class="eyebrow">PATIENT ASSESSMENT</p><h1 id="patient-title"></h1><p id="captured" class="muted"></p></div><div id="status" class="status"></div></div>
      <div id="training-note" class="training-note" hidden><b>訓練モード</b><span>模擬データを表示しています。診察・治療・蘇生の実処理は行いません。</span></div>
      <div class="metrics"><article><span>死亡・瀕死状態</span><strong id="death"></strong></article><article><span>表示できた負傷部位</span><strong id="injury-count"></strong></article><article><span>記録上の最大重症度</span><strong id="severity"></strong></article><article><span>記録上の最大出血</span><strong id="bleed"></strong></article></div>
      <section class="injury-section"><div class="section-heading"><h2>負傷の詳細</h2><span>重症度・出血は返却値の 0–4 を表示</span></div><div id="notice" class="notice" hidden></div><div id="injuries" class="injury-grid"></div></section>
      <details id="raw"><summary>取得データを確認</summary><pre id="raw-text"></pre></details>
    </div>
    <footer><span class="footer-note"><i></i>取得時点の記録 · 自動更新なし</span><div><button id="manage" class="secondary" hidden>患者の状態を変更</button><button id="refresh" class="primary">再診察する <span>↻</span></button></div></footer>
  </section>
</main>
<template id="injury-template"><article class="injury-card"><div class="injury-top"><span class="body-name"></span><span class="kind"></span></div><div class="measure"><span>重症度</span><div class="segments severity-segments"></div><b class="severity-value"></b></div><div class="measure"><span>出血</span><div class="segments bleed-segments"></div><b class="bleed-value"></b></div></article></template>
<script src="app.js"></script>
</body></html>
