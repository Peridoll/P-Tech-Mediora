<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 44" style="color:var(--mediora-progress-accent, #79dfce)" fill="none" aria-hidden="true">
  <style>
    .dressing { transform-origin: 28px 22px; animation: apply 1.5s ease-in-out infinite; }
    .pulse { transform-origin: 41px 14px; animation: pulse 1.5s ease-out infinite; }
    @keyframes apply {
      0%, 100% { transform: translate(4px, -5px) rotate(-38deg); }
      40%, 68% { transform: translate(0, 2px) rotate(-38deg); }
    }
    @keyframes pulse {
      0%, 34%, 100% { opacity: 0; transform: scale(.7); }
      49% { opacity: 1; transform: scale(1); }
      78% { opacity: 0; transform: scale(1.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dressing { animation: none; transform: translate(0, 2px) rotate(-38deg); }
      .pulse { animation: none; opacity: 0; }
    }
  </style>
  <path d="M12 30h32M17 35h22" stroke="#426674" stroke-width="1.5" stroke-linecap="round"/>
  <g class="dressing" stroke="currentColor" stroke-width="1.5">
    <rect x="12" y="16.5" width="32" height="11" rx="5.5" fill="#24444d"/>
    <rect x="23" y="18.5" width="10" height="7" rx="2" fill="currentColor" fill-opacity=".25"/>
    <path d="M17 20h2m-2 4h2m18-4h2m-2 4h2" stroke-linecap="round"/>
  </g>
  <path class="pulse" d="M41 9v10m-5-5h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
